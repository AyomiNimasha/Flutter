name: pawshots
description: Offline-first pet vaccination records for Sri Lankan pet owners.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.9.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  drift: 2.35.2
  path_provider: ^2.1.5
  path: ^1.9.1
  uuid: ^4.5.1
  http: ^1.6.0
  flutter_local_notifications: ^19.5.0
  timezone: ^0.10.1
  share_plus: ^12.0.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/fonts/OFL.txt
    - assets/fonts/Roboto-OFL.txt
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf
    # CanvasKit always initializes Roboto as its default fallback. Bundling it
    # avoids an external Google Fonts request before the first frame.
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto.ttf
